[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computecloud-node"
version = "0.1.0"
description = "ComputeCloud contributor node client — share your compute with the pool"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Eivin Tobias Mogård", email = "eivin@computecloud.dev" }]
keywords = ["distributed-compute", "marketplace", "compute-pool", "contributor"]
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
grpc = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.21",
]

[project.scripts]
computecloud-node = "computecloud_node.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
